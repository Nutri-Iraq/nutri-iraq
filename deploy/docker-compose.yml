# ══════════════════════════════════════════════
# docker-compose.yml  —  نيوتري عراق (Full Stack)
# ══════════════════════════════════════════════
services:

  # ── PostgreSQL ─────────────────────────────
  db:
    image: postgres:16-alpine
    container_name: nutri_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: nutri_iraq
      POSTGRES_USER: nutri_user
      POSTGRES_PASSWORD: ${DB_PASSWORD:-strong_pass_2026}
    volumes:
      - db_data:/var/lib/postgresql/data
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nutri_user -d nutri_iraq"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - nutri_net

  # ── Redis ──────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: nutri_redis
    restart: unless-stopped
    command: redis-server --requirepass ${REDIS_PASSWORD:-redis_pass_2026}
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    networks:
      - nutri_net

  # ── Laravel Backend ────────────────────────
  backend:
    build:
      context: ./nutri-iraq-backend
      dockerfile: ../docker/backend/Dockerfile
    container_name: nutri_backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      APP_ENV: production
      APP_KEY: ${APP_KEY}
      DB_HOST: db
      DB_DATABASE: nutri_iraq
      DB_USERNAME: nutri_user
      DB_PASSWORD: ${DB_PASSWORD:-strong_pass_2026}
      REDIS_HOST: redis
      REDIS_PASSWORD: ${REDIS_PASSWORD:-redis_pass_2026}
      WHATSAPP_TOKEN: ${WHATSAPP_TOKEN}
      WHATSAPP_PHONE_ID: ${WHATSAPP_PHONE_ID}
    volumes:
      - backend_storage:/var/www/html/storage
      - backend_logs:/var/www/html/storage/logs
    networks:
      - nutri_net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # ── Queue Worker ───────────────────────────
  queue:
    build:
      context: ./nutri-iraq-backend
      dockerfile: ../docker/backend/Dockerfile
    container_name: nutri_queue
    restart: unless-stopped
    command: php artisan queue:work --sleep=3 --tries=3 --max-time=3600
    depends_on:
      backend:
        condition: service_healthy
    environment:
      APP_ENV: production
      APP_KEY: ${APP_KEY}
      DB_HOST: db
      DB_DATABASE: nutri_iraq
      DB_USERNAME: nutri_user
      DB_PASSWORD: ${DB_PASSWORD:-strong_pass_2026}
      REDIS_HOST: redis
      REDIS_PASSWORD: ${REDIS_PASSWORD:-redis_pass_2026}
      WHATSAPP_TOKEN: ${WHATSAPP_TOKEN}
      WHATSAPP_PHONE_ID: ${WHATSAPP_PHONE_ID}
    volumes:
      - backend_storage:/var/www/html/storage
    networks:
      - nutri_net

  # ── Scheduler ─────────────────────────────
  scheduler:
    build:
      context: ./nutri-iraq-backend
      dockerfile: ../docker/backend/Dockerfile
    container_name: nutri_scheduler
    restart: unless-stopped
    command: sh -c "while true; do php artisan schedule:run --verbose --no-interaction; sleep 60; done"
    depends_on:
      backend:
        condition: service_healthy
    environment:
      APP_ENV: production
      APP_KEY: ${APP_KEY}
      DB_HOST: db
      DB_DATABASE: nutri_iraq
      DB_USERNAME: nutri_user
      DB_PASSWORD: ${DB_PASSWORD:-strong_pass_2026}
      REDIS_HOST: redis
      REDIS_PASSWORD: ${REDIS_PASSWORD:-redis_pass_2026}
    volumes:
      - backend_storage:/var/www/html/storage
    networks:
      - nutri_net

  # ── Next.js Frontend ───────────────────────
  frontend:
    build:
      context: ./nutri-iraq-frontend
      dockerfile: ../docker/frontend/Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-https://api.nutri-iraq.iq/api}
    container_name: nutri_frontend
    restart: unless-stopped
    depends_on:
      - backend
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-https://api.nutri-iraq.iq/api}
    networks:
      - nutri_net

  # ── Nginx Reverse Proxy ────────────────────
  nginx:
    image: nginx:alpine
    container_name: nutri_nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./docker/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./docker/nginx/conf.d:/etc/nginx/conf.d:ro
      - ssl_certs:/etc/ssl/certs
      - ./docker/nginx/certbot/www:/var/www/certbot:ro
    depends_on:
      - backend
      - frontend
    networks:
      - nutri_net

volumes:
  db_data:
  redis_data:
  backend_storage:
  backend_logs:
  ssl_certs:

networks:
  nutri_net:
    driver: bridge
